<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>USRKey — issue your credential</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    /* security-document palette — cool document stock, deep intaglio ink, bronze foil, seal red */
    --paper:#e9e4d6; --paper-2:#e2dccb; --paper-edge:#d6cfba;
    --ink:#13302a; --ink-2:#33534a; --ink-3:#6d7f74;
    --foil:#9a7b44; --foil-lo:#9a7b4426; --seal:#8c2b26; --seal-lo:#8c2b2618;
    --cover:#15243b; --cover-foil:#c3a15f;
    --serif:'Fraunces',Georgia,'Times New Roman',serif;
    --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
    --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --ease:cubic-bezier(.2,.7,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans); background:var(--paper); color:var(--ink);
    -webkit-font-smoothing:antialiased; overflow:hidden;
    display:grid; place-items:center; min-height:100dvh;
    background-image:
      radial-gradient(120vw 90vh at 50% -20%,rgba(19,48,42,.05),transparent 60%),
      repeating-linear-gradient(0deg,transparent 0 3px,rgba(19,48,42,.018) 3px 4px);
  }
  /* engraved rule / microprint */
  .micro{font-family:var(--mono);font-size:8px;letter-spacing:.34em;color:var(--ink-3);
    text-transform:uppercase;white-space:nowrap;overflow:hidden;user-select:none}
  .rule{height:1px;background:repeating-linear-gradient(90deg,var(--ink) 0 4px,transparent 4px 7px);opacity:.35}

  .frame{position:fixed;inset:16px;border:1px solid var(--ink);opacity:.16;pointer-events:none;z-index:1}
  .frame::before{content:"";position:absolute;inset:5px;border:1px solid var(--ink);opacity:.6}
  .mark{position:fixed;z-index:2;font-family:var(--mono);font-size:9px;letter-spacing:.28em;color:var(--ink-3);text-transform:uppercase}
  .mark.tl{top:26px;left:30px}.mark.tr{top:26px;right:30px}.mark.bl{bottom:26px;left:30px}.mark.br{bottom:26px;right:30px}

  .stage{position:relative;z-index:3;width:min(1060px,93vw);height:min(690px,92dvh);display:grid;place-items:center}
  .screen{position:absolute;inset:0;display:grid;place-items:center;
    opacity:0;transform:translateY(10px);pointer-events:none;
    transition:opacity .55s var(--ease),transform .55s var(--ease)}
  .screen.on{opacity:1;transform:none;pointer-events:auto}
  .screen.out{opacity:0;transform:translateY(-10px)}

  /* sheet = a document page */
  .sheet{width:100%;background:var(--paper);border:1px solid var(--paper-edge);position:relative;
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset, 0 30px 70px -46px rgba(19,48,42,.6);}
  .sheet::before{content:"";position:absolute;inset:8px;border:1px solid var(--ink);opacity:.14;pointer-events:none}

  h1,h2,.serif{font-family:var(--serif);font-weight:400;line-height:1.02;letter-spacing:-.01em;text-wrap:balance}
  .label{font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--foil);font-weight:600}
  .sub-ink{color:var(--ink-2)}

  .btn{appearance:none;cursor:pointer;font-family:var(--mono);font-weight:600;font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--paper);background:var(--ink);border:1px solid var(--ink);
    padding:14px 24px;transition:.25s var(--ease);position:relative}
  .btn:hover{background:#0c221d;transform:translateY(-1px)}
  .btn:active{transform:none}
  .btn.foil{background:transparent;color:var(--ink);border-color:var(--ink)}
  .btn.foil:hover{background:var(--foil-lo);border-color:var(--foil);color:var(--ink)}
  .btn:focus-visible{outline:2px solid var(--foil);outline-offset:3px}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .lnk{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--ink-3);background:none;border:none;cursor:pointer;
    text-transform:uppercase;transition:.2s;display:inline-flex;align-items:center;gap:7px}
  .lnk:hover{color:var(--ink-2)}
  .lnk:focus-visible{outline:2px solid var(--foil);outline-offset:3px}

  /* ---- COVER (passport cover) ---- */
  .cover{width:100%;background:
      radial-gradient(90% 120% at 50% -10%,#1c2f4d,var(--cover) 62%);
    border:1px solid #0c1626;position:relative;overflow:hidden;
    display:grid;grid-template-rows:1fr auto;min-height:560px;
    box-shadow:0 40px 90px -50px #000, inset 0 0 0 1px rgba(195,161,95,.12)}
  .cover::before{content:"";position:absolute;inset:22px;border:1.5px solid var(--cover-foil);opacity:.5}
  .cover .foilwrap{align-self:center;justify-self:center;text-align:center;padding:0 30px;position:relative;z-index:2}
  .cover canvas{position:absolute;inset:0;margin:auto;opacity:.9}
  .cover .label{color:var(--cover-foil)}
  .cover h1{color:#f2ead6;font-size:clamp(40px,7vw,72px);margin:16px 0 12px;
    text-shadow:0 1px 0 rgba(0,0,0,.4)}
  .cover h1 em{font-style:italic;color:var(--cover-foil)}
  .cover p{color:#b9c2d4;font-size:16px;max-width:440px;margin:0 auto 28px;line-height:1.55;font-family:var(--sans)}
  .cover .foot{position:relative;z-index:2;border-top:1px solid rgba(195,161,95,.25);
    display:flex;justify-content:space-between;align-items:center;padding:14px 26px}
  .cover .foot .micro{color:#7d8aa0}
  .emblem{width:96px;height:96px;margin:0 auto}

  /* ---- QUESTION ---- */
  .qwrap{display:grid;grid-template-columns:1.32fr .68fr;min-height:540px}
  .qmain{padding:44px 46px;display:flex;flex-direction:column}
  .qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:auto}
  .field-index{font-family:var(--mono);font-size:11px;letter-spacing:.18em;color:var(--ink-3);text-transform:uppercase}
  .stamps{display:flex;gap:6px}
  .stamps i{width:9px;height:9px;border:1.5px solid var(--ink-3);border-radius:50%;transition:.4s var(--ease)}
  .stamps i.done{background:var(--seal);border-color:var(--seal)}
  .stamps i.cur{border-color:var(--foil);box-shadow:0 0 0 3px var(--foil-lo)}
  .qbody{margin:auto 0}
  .qbody h2{font-size:clamp(30px,4.4vw,46px);margin:14px 0 12px}
  .qbody h2 em{font-style:italic;color:var(--foil)}
  .qhint{color:var(--ink-2);font-size:15px;line-height:1.55;max-width:440px;margin-bottom:24px;font-family:var(--sans)}
  .entry{position:relative}
  .entry textarea{width:100%;background:transparent;border:none;border-bottom:1.5px solid var(--ink);
    color:var(--ink);font-family:var(--serif);font-size:20px;line-height:1.5;padding:6px 2px 12px;resize:none;
    transition:.25s}
  .entry textarea:focus{outline:none;border-color:var(--foil)}
  .entry textarea::placeholder{color:var(--ink-3);font-style:italic;opacity:.7}
  .entry .cnt{position:absolute;right:2px;bottom:-20px;font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.1em}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:26px}
  .chip{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--ink-2);background:transparent;
    border:1px solid var(--paper-edge);padding:6px 11px;cursor:pointer;transition:.2s}
  .chip:hover{border-color:var(--foil);color:var(--ink);background:var(--foil-lo)}
  .qfoot{display:flex;align-items:center;justify-content:space-between;margin-top:34px;gap:16px}
  .qside{background:linear-gradient(180deg,var(--paper-2),var(--paper));border-left:1px solid var(--paper-edge);
    position:relative;display:grid;place-items:center;overflow:hidden}
  .qside canvas{width:260px;height:260px}
  .sidenote{position:absolute;bottom:22px;left:0;right:0;text-align:center;padding:0 26px}
  .sidenote .micro{letter-spacing:.2em;color:var(--ink-3)}
  .sidenote b{color:var(--seal);font-weight:600}

  /* ---- CREDENTIAL (reveal) ---- */
  .reveal{padding:34px 40px;width:100%;display:grid;justify-items:center;gap:18px}
  .credential{width:min(560px,96%);background:
      linear-gradient(158deg,#efe9db,#e4ddc9);border:1px solid var(--paper-edge);position:relative;overflow:hidden;
    box-shadow:0 26px 60px -34px rgba(19,48,42,.65), inset 0 0 0 1px rgba(255,255,255,.4);
    transform:perspective(1400px);transition:transform .25s var(--ease)}
  .credential .guilloche{position:absolute;inset:0;opacity:.5;pointer-events:none}
  .cr-pad{position:relative;padding:22px 24px 0}
  .cr-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px}
  .cr-issuer .label{color:var(--foil)}
  .cr-issuer .t{font-family:var(--serif);font-size:15px;color:var(--ink);margin-top:3px}
  .cr-type{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;color:var(--ink-3);text-transform:uppercase;text-align:right}
  .cr-body{display:grid;grid-template-columns:1fr 84px;gap:16px;align-items:start}
  .cr-name{font-family:var(--serif);font-size:38px;line-height:1;color:var(--ink);margin-bottom:3px}
  .cr-role{font-family:var(--sans);font-size:13px;color:var(--ink-2);margin-bottom:14px}
  .cr-fields{display:grid;gap:9px}
  .cr-f{display:grid;grid-template-columns:74px 1fr;gap:12px;align-items:baseline}
  .cr-f .k{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
  .cr-f .v{font-family:var(--serif);font-size:14px;color:var(--ink);line-height:1.4}
  .cr-f .v.skip{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase}
  .cr-seal{width:84px;height:84px;position:relative}
  .cr-seal canvas{width:84px;height:84px}
  .cr-seal .word{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);
    font-size:7.5px;letter-spacing:.14em;color:var(--seal);text-align:center;text-transform:uppercase;font-weight:600}
  .mrz{margin-top:16px;background:repeating-linear-gradient(90deg,rgba(19,48,42,.05) 0 2px,transparent 2px 4px);
    border-top:1px solid var(--ink);padding:9px 14px 12px}
  .mrz div{font-family:var(--mono);font-size:12.5px;letter-spacing:.14em;color:var(--ink);white-space:nowrap;overflow:hidden;line-height:1.7}
  .reveal .cap{font-family:var(--sans);color:var(--ink-2);font-size:14.5px;max-width:440px;text-align:center;line-height:1.5}

  /* ---- MAGIC (reader scans credential) ---- */
  .magic{width:100%;padding:30px 40px 38px}
  .magic .top{text-align:center;margin-bottom:16px}
  .magic h2{font-size:clamp(28px,4vw,42px)}
  .magic h2 em{font-style:italic;color:var(--foil)}
  .magic .top p{font-family:var(--sans);color:var(--ink-2);font-size:14px;margin-top:8px}
  .reader{border:1px solid var(--ink);background:var(--paper-2);position:relative;overflow:hidden}
  .reader .rbar{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;border-bottom:1px solid var(--paper-edge)}
  .reader .rbar .micro{color:var(--ink-3)}
  .reader .rbar .live{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--seal);text-transform:uppercase}
  .reader .rbar .live i{width:7px;height:7px;border-radius:50%;background:var(--seal);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
  .scanline{padding:10px 14px;font-family:var(--mono);font-size:12px;letter-spacing:.12em;color:var(--ink-2);border-bottom:1px dashed var(--paper-edge);white-space:nowrap;overflow:hidden}
  .scanline .ok{color:var(--foil)}
  .msgs{padding:18px;display:flex;flex-direction:column;gap:12px;min-height:190px}
  .msg{max-width:84%;font-size:15px;line-height:1.55;padding:11px 15px;opacity:0;transform:translateY(6px);
    animation:pop .5s var(--ease) forwards}
  .msg.you{align-self:flex-end;font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--ink-2);
    border:1px solid var(--paper-edge);padding:8px 13px}
  .msg.ai{align-self:flex-start;font-family:var(--serif);color:var(--ink);background:var(--paper);
    border-left:2px solid var(--foil);padding-left:16px}
  .msg.ai b{color:var(--seal);font-weight:600;font-style:normal}
  @keyframes pop{to{opacity:1;transform:none}}
  .typing{display:inline-flex;gap:4px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:blink 1.1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

  /* ---- CONTROL (endorsements) ---- */
  .ctrl{padding:36px 44px;width:100%}
  .ctrl h2{font-size:clamp(26px,3.6vw,38px);margin:8px 0 6px}
  .ctrl h2 em{font-style:italic;color:var(--foil)}
  .ctrl .lede{font-family:var(--sans);color:var(--ink-2);font-size:14.5px;max-width:560px;line-height:1.55;margin-bottom:24px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:start}
  .grants{display:grid}
  .grant{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-top:1px solid var(--paper-edge)}
  .grant:first-child{border-top:none}
  .grant .who{display:flex;align-items:center;gap:11px}
  .grant .who .m{width:30px;height:30px;border:1px solid var(--ink);display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:12px;color:var(--ink)}
  .grant .who .n{font-family:var(--serif);font-size:16px}
  .grant .who .s{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase;margin-top:2px}
  .grant .st{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--foil);
    border:1px solid var(--foil);padding:3px 8px;transform:rotate(-3deg)}
  .private{margin-top:14px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--seal);
    display:flex;gap:8px;align-items:flex-start;line-height:1.5}
  .filebox{border:1px solid var(--ink)}
  .filebox .fb{display:flex;align-items:center;justify-content:space-between;padding:9px 13px;border-bottom:1px solid var(--paper-edge)}
  .filebox .fb .fn{font-family:var(--mono);font-size:11px;color:var(--foil);letter-spacing:.04em}
  .filebox .fb .micro{color:var(--ink-3)}
  pre{padding:14px 15px;font-family:var(--mono);font-size:11.5px;line-height:1.7;color:var(--ink);white-space:pre-wrap;
    max-height:230px;overflow:auto;background:var(--paper)}
  pre .h{color:var(--foil);font-weight:600}pre .c{color:var(--ink-3)}
  .ctrl .foot{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:26px;flex-wrap:wrap}
  .ctrl .foot p{font-family:var(--sans);color:var(--ink-3);font-size:12.5px;max-width:440px;line-height:1.55}

  .restart{position:fixed;bottom:26px;right:30px;z-index:6}

  @media(max-width:860px){
    .qwrap,.grid2{grid-template-columns:1fr}.qside{display:none}
    .qmain,.ctrl,.reveal,.magic{padding-left:26px;padding-right:26px}
    .mark{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition-duration:.01ms !important}}
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="mark tl">USRKEY · SELF-ISSUED</div>
  <div class="mark tr">SPECIMEN</div>
  <div class="mark bl">FORM 4Q · REV. A</div>
  <div class="mark br" id="serialmark">NO. ————</div>
  <div class="stage" id="stage"></div>
  <div class="restart" style="display:none"><button class="lnk" id="restart">↺ void &amp; reissue</button></div>

<script>
/* ============ guilloché engine (canvas) ============ */
function seal(canvas, ringsDone, partial, opts){
  opts=opts||{};
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const W=canvas.clientWidth||canvas.width, H=canvas.clientHeight||canvas.height;
  canvas.width=W*dpr; canvas.height=H*dpr;
  const ctx=canvas.getContext('2d'); ctx.scale(dpr,dpr);
  ctx.clearRect(0,0,W,H);
  const cx=W/2, cy=H/2, base=Math.min(W,H)/2-6;
  const ink=opts.ink||'#13302a', foil=opts.foil||'#9a7b44', red=opts.seal||'#8c2b26';
  // four concentric guilloché rosettes (hypotrochoid), one per answered field
  const rings=[
    {ro:base*0.98, ri:base*0.20, d:base*0.20, turns:36, col:ink,  a:0.55},
    {ro:base*0.80, ri:base*0.13, d:base*0.15, turns:29, col:foil, a:0.70},
    {ro:base*0.62, ri:base*0.17, d:base*0.11, turns:31, col:ink,  a:0.55},
    {ro:base*0.44, ri:base*0.09, d:base*0.10, turns:23, col:red,  a:0.65}
  ];
  ctx.lineWidth=0.7;
  for(let k=0;k<4;k++){
    let frac=0;
    if(k<ringsDone) frac=1;
    else if(k===ringsDone) frac=partial;
    if(frac<=0) continue;
    const r=rings[k]; ctx.globalAlpha=r.a; ctx.strokeStyle=r.col; ctx.beginPath();
    const steps=Math.floor(r.turns*70*frac), TAU=Math.PI*2, tot=r.turns*TAU;
    for(let s=0;s<=steps;s++){
      const t=(s/(r.turns*70))*TAU;
      const rr=r.ro-r.ri;
      const x=cx+rr*Math.cos(t)+r.d*Math.cos((rr/r.ri)*t);
      const y=cy+rr*Math.sin(t)-r.d*Math.sin((rr/r.ri)*t);
      s?ctx.lineTo(x,y):ctx.moveTo(x,y);
    }
    ctx.stroke();
  }
  // inner ring outline once anything drawn
  if(ringsDone>0||partial>0){
    ctx.globalAlpha=0.8; ctx.strokeStyle=foil; ctx.lineWidth=1.1;
    ctx.beginPath(); ctx.arc(cx,cy,base*0.30,0,Math.PI*2); ctx.stroke();
    ctx.globalAlpha=0.5; ctx.strokeStyle=ink; ctx.lineWidth=0.8;
    ctx.beginPath(); ctx.arc(cx,cy,base*0.985,0,Math.PI*2); ctx.stroke();
  }
  ctx.globalAlpha=1;
}
function animateSeal(canvas,ringsDone,opts){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){seal(canvas,ringsDone+1,0,opts);return;}
  let p=0, t0=null;
  function step(ts){ if(!t0)t0=ts; p=Math.min(1,(ts-t0)/850);
    seal(canvas,ringsDone,p,opts);
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
let coverRot;
function spinSeal(canvas,opts){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){seal(canvas,4,0,opts);return;}
  seal(canvas,4,0,opts);
}

/* ============ content ============ */
const QS=[
  {key:'identity',n:'FIELD 01 — BEARER',h:'Who <em>are</em> you?',
   hint:'Your name and what you do — the introduction you wish every AI already had.',
   ph:'Chad — founder building USRKey. US Central.',
   chips:['Founder','Engineer','Designer','Writer','Researcher'],
   note:'Only what you inscribe here is issued. <b>Nothing is inferred.</b>'},
  {key:'stack',n:'FIELD 02 — WORKING CONTEXT',h:'What&rsquo;s your <em>world</em>?',
   hint:'The tools you live in and how you like to work — so an agent is useful on day one, not day five.',
   ph:'TypeScript / Node, SQLite. Cursor + Claude Code. Show me the diff, not the whole file.',
   chips:['Show diffs','Terse first','Plan before code','No unasked refactors'],
   note:'The context agents draw on <b>most often.</b>'},
  {key:'now',n:'FIELD 03 — CURRENT STANDING',h:'What&rsquo;s true <em>this week</em>?',
   hint:'Your current focus. This field is dated — a nudge reminds you to renew it.',
   ph:'Launching USRKey. Recording the demo this week. Async-only Thu–Sun.',
   chips:['Launching soon','Deep in a build','Traveling','Crunch mode'],
   note:'Expires by design. <b>Renew to keep it true.</b>'},
  {key:'bounds',n:'FIELD 04 — CONDITIONS OF USE',h:'What must an AI <em>never</em> do?',
   hint:'The clause that makes the rest safe to grant. Never handed out without your say-so.',
   ph:"Don't infer my mood or health. Never store anything about my family. Correct me directly.",
   chips:["Don't guess mood","Never mention family","No financial figures","Ask if unsure"],
   note:'Sealed. Agents may <b>read, never amend.</b>'}
];
const state={identity:'',stack:'',now:'',bounds:''};
const SERIAL='UK-'+('7Q4M2X9');
let step=0;
const stage=document.getElementById('stage');
const restartWrap=document.querySelector('.restart');
document.getElementById('serialmark').textContent='NO. '+SERIAL;

function firstName(){const s=(state.identity||'BEARER').trim();const m=s.match(/[A-Z][a-z]+/);return m?m[0]:(s.split(/[\s,—-]/)[0]||'BEARER');}
function surname(){const s=(state.identity||'').trim();const caps=s.match(/[A-Z][a-z]+/g)||[];return caps[1]||'—';}
function esc(t){return (t||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function clause(t,f){if(!t)return f;const c=t.split(/[.\n—;]/)[0].trim();return c||f;}
function mrz(){
  const up=s=>(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'<').replace(/<+/g,'<');
  const pad=(s,n)=>(s+'<'.repeat(n)).slice(0,n);
  const l1=pad('P<USRKEY'+up(surname())+'<<'+up(firstName()),44);
  const l2=pad(SERIAL.replace(/[^A-Z0-9]/g,'')+'4USR'+up(firstName()).slice(0,4),44);
  return [l1,l2];
}

/* ============ render ============ */
function render(){
  const prev=stage.querySelector('.screen.on');
  if(prev){prev.classList.remove('on');prev.classList.add('out');setTimeout(()=>prev.remove(),520);}
  const el=document.createElement('div');el.className='screen';el.innerHTML=view();
  stage.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('on')));
  restartWrap.style.display=step>0?'block':'none';
  wire(el);
}
function view(){
  if(step===0)return cover();
  if(step>=1&&step<=4)return question(step-1);
  if(step===5)return reveal();
  if(step===6)return magic();
  return control();
}
function cover(){return `<div class="cover">
  <canvas width="360" height="360" id="coverseal"></canvas>
  <div class="foilwrap">
    <canvas class="emblem" width="96" height="96" id="emblem"></canvas>
    <div class="label">Issued by you · honored everywhere</div>
    <h1>Issue yourself<br>a <em>credential</em>.</h1>
    <p>Four fields. Share only what you choose. Then any AI, anywhere, reads your credential and knows exactly that much — no more.</p>
    <button class="btn" data-go="1">Begin issuance →</button>
  </div>
  <div class="foot"><span class="micro">USER CONTEXT PROTOCOL</span><span class="micro">SPECIMEN · NON-TRANSFERABLE</span></div>
</div>`;}
function question(i){const q=QS[i];
  const stamps='<div class="stamps">'+[0,1,2,3].map(k=>`<i class="${k<i?'done':k===i?'cur':''}"></i>`).join('')+'</div>';
  return `<div class="sheet"><div class="qwrap">
    <div class="qmain">
      <div class="qhead"><span class="field-index">${q.n}</span>${stamps}</div>
      <div class="qbody">
        <h2>${q.h}</h2>
        <p class="qhint">${q.hint}</p>
        <div class="entry">
          <textarea id="ans" rows="2" maxlength="240" placeholder="${q.ph}">${esc(state[q.key])}</textarea>
          <span class="cnt" id="cnt"></span>
        </div>
        <div class="chips">${q.chips.map(c=>`<button class="chip">${c}</button>`).join('')}</div>
      </div>
      <div class="qfoot">
        <button class="lnk" data-skip="1">✕ leave blank — I&rsquo;d rather not say</button>
        <button class="btn" data-next="1">${i<3?'Inscribe →':'Seal the credential →'}</button>
      </div>
    </div>
    <div class="qside">
      <canvas width="260" height="260" id="qseal"></canvas>
      <div class="sidenote"><div class="micro" style="margin-bottom:6px">SEAL · ${i+1} OF 4 ENGRAVED</div><span class="micro" style="letter-spacing:.06em;text-transform:none;font-size:11px">${q.note}</span></div>
    </div>
  </div></div>`;}
function reveal(){
  const name=firstName();
  let role=clause(state.identity,'').replace(new RegExp('^'+name+'[\\s,—-]*','i'),'').trim()||'Context, self-issued';
  const [l1,l2]=mrz();
  const f=(k,v,ph)=>`<div class="cr-f"><span class="k">${k}</span>${v?`<span class="v">${esc(v)}</span>`:`<span class="v skip">${ph}</span>`}</div>`;
  return `<div class="reveal">
    <span class="label">Credential sealed · ${SERIAL}</span>
    <div class="credential" id="cred">
      <canvas class="guilloche" width="560" height="360" id="credbg"></canvas>
      <div class="cr-pad">
        <div class="cr-top">
          <div class="cr-issuer"><div class="label">USRKey</div><div class="t">Bearer Context Credential</div></div>
          <div class="cr-type">TYPE 4Q<br>SELF-ISSUED<br>NON-TRANSFERABLE</div>
        </div>
        <div class="cr-body">
          <div>
            <div class="cr-name">${esc(name)}</div>
            <div class="cr-role">${esc(role)}</div>
            <div class="cr-fields">
              ${f('Working in',state.stack,'left blank')}
              ${f('Standing',state.now,'left blank')}
              ${f('Conditions',state.bounds?'Sealed · read-only to agents':'','left blank')}
            </div>
          </div>
          <div class="cr-seal"><canvas width="84" height="84" id="credseal"></canvas><div class="word">USR·KEY·SELF·</div></div>
        </div>
      </div>
      <div class="mrz"><div>${l1}</div><div>${l2}</div></div>
    </div>
    <p class="cap">Exactly what you chose to grant — nothing more. Now watch a machine you&rsquo;ve never met read it.</p>
    <button class="btn foil" data-go="6">Present to a fresh AI →</button>
  </div>`;}
function magic(){return `<div class="magic">
  <div class="top"><span class="label" style="color:var(--seal)">The moment</span>
    <h2 style="margin-top:8px">A new machine. <em>No introduction.</em></h2>
    <p>A model you&rsquo;ve never used. It reads only your credential.</p></div>
  <div class="reader">
    <div class="rbar"><span class="micro">CONTEXT READER · MRZ INTAKE</span><span class="live"><i></i>reading credential</span></div>
    <div class="scanline" id="scan"></div>
    <div class="msgs" id="msgs"></div>
  </div>
</div>`;}
function control(){
  const name=firstName();
  const md=`<span class="c"># identity</span>
${esc(state.identity||'(left blank)')}

<span class="h"># stack</span>
${esc(state.stack||'(left blank)')}

<span class="h"># now  </span><span class="c">· dated</span>
${esc(state.now||'(left blank)')}

<span class="h"># boundaries</span> <span class="c">· sealed, read-only</span>
${esc(state.bounds||'(left blank)')}`;
  const g=(m,n,s)=>`<div class="grant"><div class="who"><div class="m">${m}</div><div><div class="n">${n}</div><div class="s">${s}</div></div></div><div class="st">granted</div></div>`;
  return `<div class="sheet"><div class="ctrl">
    <span class="label">Endorsements</span>
    <h2>One credential. <em>You</em> stamp who reads what.</h2>
    <p class="lede">Each agent is granted only the fields you endorse — and your conditions are never handed out in a default bundle. Revoke or re-stamp anytime; nothing leaves your device unless you say so.</p>
    <div class="grid2">
      <div>
        <div class="grants">
          ${g('C','Claude','identity · stack · now · history')}
          ${g('⌘','Cursor','identity · stack · now')}
          ${g('G','ChatGPT · web','identity · stack')}
          ${g('+','Any other','identity only')}
        </div>
        <div class="private">▲ Conditions of use stay sealed — readable by agents, never amendable, never in a default grant.</div>
      </div>
      <div class="filebox">
        <div class="fb"><span class="fn">◆ ${name.toLowerCase()}.usrkey.md</span><span class="micro">THE BACKING · PLAIN TEXT</span></div>
        <pre>${md}</pre>
      </div>
    </div>
    <div class="foot">
      <p>Underneath the seal it&rsquo;s a file you own and can read. The credential is only how it feels — carried to every AI, showing only what you chose.</p>
      <button class="btn foil" data-go="0">↺ Issue another</button>
    </div>
  </div></div>`;}

/* ============ wiring ============ */
function wire(el){
  el.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{step=+b.dataset.go;render();});
  el.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{save(el);step++;render();});
  el.querySelectorAll('[data-skip]').forEach(b=>b.onclick=()=>{state[QS[step-1].key]='';step++;render();});
  const ta=el.querySelector('#ans'), cnt=el.querySelector('#cnt');
  if(ta){
    const upd=()=>{cnt.textContent=ta.value.length?ta.value.length+'/240':'';};upd();
    setTimeout(()=>ta.focus(),560);
    ta.addEventListener('input',upd);
    el.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ta.value=(ta.value.trim()?ta.value.trim()+', ':'')+c.textContent;ta.focus();upd();});
    ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){save(el);step++;render();}});
    const qs=el.querySelector('#qseal'); if(qs) animateSeal(qs,step-1,{});
  }
  const cs=el.querySelector('#coverseal'); if(cs) spinSeal(cs,{ink:'#c3a15f',foil:'#c3a15f',seal:'#c3a15f'});
  const em=el.querySelector('#emblem'); if(em) seal(em,4,0,{ink:'#c3a15f',foil:'#e6d3a6',seal:'#c3a15f'});
  const cb=el.querySelector('#credbg'); if(cb) seal(cb,4,0,{});
  const csl=el.querySelector('#credseal'); if(csl) seal(csl,4,0,{ink:'#8c2b26',foil:'#9a7b44',seal:'#8c2b26'});
  const cred=el.querySelector('#cred');
  if(cred)cred.addEventListener('mousemove',e=>{const r=cred.getBoundingClientRect();
    cred.style.transform=`perspective(1400px) rotateY(${((e.clientX-r.left)/r.width-.5)*6}deg) rotateX(${(.5-(e.clientY-r.top)/r.height)*6}deg)`;});
  if(cred)cred.addEventListener('mouseleave',()=>cred.style.transform='perspective(1400px)');
  if(el.querySelector('#msgs'))runReader(el);
}
function save(el){const ta=el.querySelector('#ans');if(ta)state[QS[step-1].key]=ta.value.trim();}
document.getElementById('restart').onclick=()=>{step=0;render();};

/* ============ magic-moment reader ============ */
function runReader(el){
  const scan=el.querySelector('#scan'), box=el.querySelector('#msgs');
  const name=firstName(), stack=clause(state.stack,''), now=clause(state.now,''), bound=clause(state.bounds,'');
  const [l1]=mrz();
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  let i=0;
  function typeScan(){
    if(reduce){scan.innerHTML=l1+' &nbsp;<span class="ok">✓ VERIFIED</span>';return talk();}
    if(i<=l1.length){scan.textContent=l1.slice(0,i);i++;setTimeout(typeScan,16);}
    else{scan.innerHTML=l1+' &nbsp;<span class="ok">✓ VERIFIED</span>';setTimeout(talk,340);}
  }
  function talk(){
    box.innerHTML=`<div class="msg you">hey</div>`;
    const parts=[`Hello <b>${esc(name)}</b> — your credential checks out.`];
    if(stack)parts.push(`I can see your working context (${esc(stack.toLowerCase())}), so I&rsquo;ll skip the onboarding.`);
    if(now)parts.push(`And your standing this week: <b>${esc(now.toLowerCase())}</b>.`);
    parts.push(bound?`I&rsquo;ll honor your conditions of use. Where shall we start?`:`Where shall we start?`);
    const ai=`<div class="msg ai">${parts.join(' ')}</div>`;
    setTimeout(()=>{
      const t=document.createElement('div');t.className='msg ai';t.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';box.appendChild(t);
      setTimeout(()=>{t.outerHTML=ai;
        setTimeout(()=>{const c=document.createElement('div');c.style.cssText='text-align:center;margin-top:14px';
          c.innerHTML='<button class="btn foil" data-go="7">It read only what you granted →</button>';
          box.parentElement.appendChild(c);c.querySelector('button').onclick=()=>{step=7;render();};},640);
      },reduce?0:1300);
    },520);
  }
  typeScan();
}
render();
</script>
</body>
</html>
