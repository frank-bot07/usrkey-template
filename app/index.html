<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>USRKey</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;560;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0a0a0b; --bg-2:#0e0e10; --surf:#151517; --surf-2:#1c1c1f;
    --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
    --ink:#f4f4f6; --mut:#8b8b93; --dim:#54545c;
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    --mono:'JetBrains Mono',ui-monospace,'SF Mono','SFMono-Regular',Menlo,monospace;
    --ease:cubic-bezier(.2,.8,.2,1);
    /* holographic accent — used only on the object */
    --h1:#7cf3d0; --h2:#8ea2ff; --h3:#e58bff; --h4:#ffd27c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;
    overflow:hidden;display:grid;place-items:center;min-height:100dvh;
    background-image:radial-gradient(140vw 100vh at 50% -30%,#141418,transparent 60%);}
  ::selection{background:rgba(142,162,255,.28)}

  .stage{position:relative;z-index:2;width:min(1080px,94vw);height:min(700px,92dvh);display:grid;place-items:center}
  .screen{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transform:translateY(8px) scale(.995);
    pointer-events:none;transition:opacity .5s var(--ease),transform .5s var(--ease)}
  .screen.on{opacity:1;transform:none;pointer-events:auto}
  .screen.out{opacity:0;transform:translateY(-8px) scale(.995)}

  .mono{font-family:var(--mono)}
  .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
  .kicker .b{color:var(--h1)}
  h1{font-size:clamp(44px,7.4vw,86px);line-height:.98;letter-spacing:-.035em;font-weight:600}
  h2{font-size:clamp(30px,4.6vw,52px);line-height:1;letter-spacing:-.03em;font-weight:600}
  .btn{appearance:none;cursor:pointer;font-family:var(--sans);font-weight:560;font-size:14px;letter-spacing:-.01em;
    color:#0a0a0b;background:var(--ink);border:1px solid var(--ink);padding:12px 20px;border-radius:10px;
    transition:.22s var(--ease);display:inline-flex;align-items:center;gap:8px}
  .btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px -10px rgba(255,255,255,.3)}
  .btn:active{transform:none}
  .btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-2)}
  .btn.ghost:hover{background:var(--surf-2);box-shadow:none}
  .btn:focus-visible{outline:2px solid var(--h2);outline-offset:3px}
  .lnk{font-family:var(--sans);font-size:13px;color:var(--dim);background:none;border:none;cursor:pointer;transition:.2s;letter-spacing:-.01em}
  .lnk:hover{color:var(--mut)}
  .lnk:focus-visible{outline:2px solid var(--h2);outline-offset:3px;border-radius:4px}

  /* ---------- WELCOME ---------- */
  .welcome{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;width:100%;padding:0 8px}
  .welcome .copy{max-width:460px}
  .welcome h1{margin:18px 0 20px}
  .welcome h1 .g{background:linear-gradient(96deg,var(--h1),var(--h2) 46%,var(--h3));-webkit-background-clip:text;background-clip:text;color:transparent}
  .welcome p{color:var(--mut);font-size:16.5px;line-height:1.55;margin-bottom:30px;letter-spacing:-.01em}
  .welcome .row{display:flex;align-items:center;gap:16px}
  .welcome .meta{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.02em;margin-top:22px;display:flex;gap:14px}
  .welcome .meta b{color:var(--mut);font-weight:400}
  .herostage{position:relative;height:420px;display:grid;place-items:center}

  /* ---------- holographic card ---------- */
  .kc{position:relative;width:310px;height:196px;border-radius:18px;transform-style:preserve-3d;
    transition:transform .1s linear;will-change:transform}
  .kc .face{position:absolute;inset:0;border-radius:18px;overflow:hidden;
    background:linear-gradient(150deg,#161619,#0e0e10);border:1px solid var(--line-2);
    box-shadow:0 30px 60px -24px #000, inset 0 1px 0 rgba(255,255,255,.06)}
  .kc .holo{position:absolute;inset:0;opacity:.9;mix-blend-mode:screen;
    background:conic-gradient(from var(--a,0deg) at 30% 20%,
      transparent, #7cf3d022 12%, #8ea2ff33 26%, #e58bff2e 40%, transparent 55%, #ffd27c22 72%, transparent 90%);
    filter:blur(2px)}
  .kc .sheen{position:absolute;inset:-2px;border-radius:18px;padding:1px;pointer-events:none;
    background:conic-gradient(from var(--a,0deg),#7cf3d0,#8ea2ff,#e58bff,#ffd27c,#7cf3d0);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:.55}
  .kc .grid{position:absolute;inset:0;opacity:.5;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:22px 22px;-webkit-mask:radial-gradient(120% 90% at 70% 10%,#000,transparent 75%)}
  .kc .content{position:absolute;inset:0;padding:18px 20px;display:flex;flex-direction:column;justify-content:space-between}
  .kc .top{display:flex;justify-content:space-between;align-items:flex-start}
  .kc .brand{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--ink);text-transform:uppercase}
  .kc .chip{width:34px;height:26px;border-radius:6px;background:linear-gradient(135deg,#3a3a40,#232327);
    border:1px solid var(--line-2);position:relative}
  .kc .chip::after{content:"";position:absolute;inset:5px;border:1px solid rgba(255,255,255,.12);border-radius:3px}
  .kc .nm{font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1}
  .kc .sub{font-family:var(--mono);font-size:10px;color:var(--mut);letter-spacing:.08em;margin-top:6px}
  .kc .bars{display:flex;gap:5px;margin-top:12px}
  .kc .bars i{height:4px;width:26px;border-radius:2px;background:var(--surf-2);transition:.5s var(--ease)}
  .kc .bars i.on{background:linear-gradient(90deg,var(--h1),var(--h2));box-shadow:0 0 10px rgba(124,243,208,.4)}
  .heroglow{position:absolute;width:340px;height:230px;border-radius:24px;filter:blur(60px);opacity:.4;z-index:-1;
    background:conic-gradient(from 0deg,#7cf3d0,#8ea2ff,#e58bff,#ffd27c,#7cf3d0);animation:spin 8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- QUESTION ---------- */
  .panel{width:100%;background:var(--bg-2);border:1px solid var(--line);border-radius:20px;overflow:hidden;
    box-shadow:0 40px 100px -50px #000}
  .qwrap{display:grid;grid-template-columns:1.3fr .7fr;min-height:520px}
  .qmain{padding:44px 46px;display:flex;flex-direction:column}
  .qtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:auto}
  .prog{display:flex;gap:6px}
  .prog i{height:3px;width:34px;border-radius:2px;background:var(--surf-2);transition:.45s var(--ease)}
  .prog i.done{background:var(--ink)}
  .prog i.cur{background:linear-gradient(90deg,var(--h1),var(--h2))}
  .qidx{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.14em}
  .asker{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
  .asker .orb{width:16px;height:16px;border-radius:50%;background:conic-gradient(from 0deg,var(--h1),var(--h2),var(--h3),var(--h4),var(--h1));box-shadow:0 0 10px rgba(124,243,208,.45);animation:spin 6s linear infinite}
  .qbody{margin:auto 0}
  .qbody h2{margin:12px 0 12px}
  .qbody h2 .g{background:linear-gradient(96deg,var(--h1),var(--h2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .qhint{color:var(--mut);font-size:15px;line-height:1.55;max-width:430px;margin-bottom:26px;letter-spacing:-.01em}
  .entry{position:relative}
  .entry textarea{width:100%;background:var(--surf);border:1px solid var(--line-2);border-radius:12px;
    color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;padding:15px 16px;resize:none;
    transition:.22s var(--ease);letter-spacing:-.01em}
  .entry textarea:focus{outline:none;border-color:var(--h2);box-shadow:0 0 0 4px rgba(142,162,255,.14)}
  .entry textarea::placeholder{color:var(--dim)}
  .cnt{position:absolute;right:12px;bottom:10px;font-family:var(--mono);font-size:10px;color:var(--dim)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
  .chip{font-family:var(--sans);font-size:13px;color:var(--mut);background:var(--surf);border:1px solid var(--line);
    padding:7px 13px;border-radius:20px;cursor:pointer;transition:.2s;letter-spacing:-.01em}
  .chip:hover{color:var(--ink);border-color:var(--h2);background:rgba(142,162,255,.08)}
  .qfoot{display:flex;align-items:center;justify-content:space-between;margin-top:32px;gap:16px}
  .qside{background:radial-gradient(120% 80% at 60% 30%,#161619,var(--bg-2));border-left:1px solid var(--line);
    position:relative;display:grid;place-items:center;overflow:hidden}
  .qside .kc{transform:scale(.86)}
  .sidenote{position:absolute;bottom:22px;left:0;right:0;text-align:center;padding:0 26px;
    font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.02em;line-height:1.6}
  .sidenote b{color:var(--h1)}

  /* ---------- REVEAL ---------- */
  .reveal{display:grid;justify-items:center;gap:22px;width:100%;padding:20px}
  .reveal .kc{width:400px;height:252px}
  .reveal .kc .nm{font-size:28px}
  .reveal .rows{width:min(400px,92%);display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .reveal .rr{display:grid;grid-template-columns:96px 1fr;background:var(--bg-2);padding:11px 15px;gap:12px;align-items:baseline}
  .reveal .rr .k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .reveal .rr .v{font-size:14px;color:var(--ink);letter-spacing:-.01em}
  .reveal .rr .v.skip{color:var(--dim);font-style:italic}
  .reveal .cap{color:var(--mut);font-size:15px;max-width:440px;text-align:center;line-height:1.55;letter-spacing:-.01em}

  /* ---------- MAGIC ---------- */
  .magic{width:100%;padding:26px 40px 34px}
  .magic .top{text-align:center;margin-bottom:16px}
  .magic .top p{color:var(--mut);font-size:14px;margin-top:8px;letter-spacing:-.01em}
  .magic h2 .g{background:linear-gradient(96deg,var(--h2),var(--h3));-webkit-background-clip:text;background-clip:text;color:transparent}
  .chatwin{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg-2)}
  .cbar{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--line)}
  .cbar .l{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--mut);letter-spacing:.04em}
  .cbar .pill{font-family:var(--mono);font-size:10px;color:var(--h1);border:1px solid rgba(124,243,208,.3);
    background:rgba(124,243,208,.08);padding:2px 9px;border-radius:20px;letter-spacing:.06em}
  .msgs{padding:20px;display:flex;flex-direction:column;gap:13px;min-height:200px}
  .msg{max-width:82%;font-size:15px;line-height:1.55;padding:11px 15px;border-radius:14px;letter-spacing:-.01em;
    opacity:0;transform:translateY(6px);animation:pop .45s var(--ease) forwards}
  .msg.you{align-self:flex-end;background:var(--surf-2);border:1px solid var(--line-2);border-bottom-right-radius:4px;color:var(--mut)}
  .msg.ai{align-self:flex-start;background:var(--surf);border:1px solid var(--line);border-bottom-left-radius:4px}
  .msg.ai b{background:linear-gradient(96deg,var(--h1),var(--h2));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:600}
  @keyframes pop{to{opacity:1;transform:none}}
  .typing{display:inline-flex;gap:4px}.typing i{width:6px;height:6px;border-radius:50%;background:var(--mut);animation:blink 1.1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

  /* ---------- CONTROL ---------- */
  .ctrl{padding:38px 44px;width:100%}
  .ctrl h2{margin:12px 0 8px}
  .ctrl h2 .g{background:linear-gradient(96deg,var(--h1),var(--h2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .ctrl .lede{color:var(--mut);font-size:15px;max-width:560px;line-height:1.55;margin-bottom:26px;letter-spacing:-.01em}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
  .tool{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
  .tool:first-child{border-top:none}
  .tool .w{display:flex;align-items:center;gap:11px}
  .tool .av{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:12px;color:#0a0a0b}
  .tool .n{font-size:15px;letter-spacing:-.01em}
  .tool .s{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:2px;letter-spacing:.02em}
  .tool .tag{font-family:var(--mono);font-size:10px;color:var(--h1);border:1px solid rgba(124,243,208,.3);background:rgba(124,243,208,.07);padding:3px 9px;border-radius:16px;letter-spacing:.04em}
  .sealed{margin-top:14px;font-family:var(--mono);font-size:11px;color:var(--h3);display:flex;gap:8px;align-items:flex-start;line-height:1.55;letter-spacing:.01em}
  .filebox{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surf)}
  .fb{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;border-bottom:1px solid var(--line)}
  .fb .fn{font-family:var(--mono);font-size:11px;color:var(--h1);letter-spacing:.02em}
  .fb .m{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
  pre{padding:14px 15px;font-family:var(--mono);font-size:11.5px;line-height:1.7;color:#cfcfd6;white-space:pre-wrap;max-height:220px;overflow:auto}
  pre .h{color:var(--h1)}pre .c{color:var(--dim)}
  .ctrl .foot{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:26px;flex-wrap:wrap}
  .ctrl .foot p{color:var(--dim);font-size:12.5px;max-width:440px;line-height:1.55;letter-spacing:-.01em}

  .restart{position:fixed;bottom:24px;right:28px;z-index:6}
  .wm{position:fixed;top:22px;left:26px;z-index:5;font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--mut);display:flex;align-items:center;gap:8px}
  .wm .d{width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,var(--h1),var(--h2))}

  @media(max-width:880px){.welcome,.qwrap,.grid2{grid-template-columns:1fr}.qside,.herostage{display:none}.qmain,.ctrl,.magic{padding:30px 26px}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
  <div class="stage" id="stage"></div>
  <div class="restart" style="display:none"><button class="lnk" id="restart">↺ start over</button></div>

<script>
/* holographic card markup */
function cardHTML(name,sub,bars,big){
  const b=[0,1,2,3].map(i=>`<i class="${i<bars?'on':''}"></i>`).join('');
  return `<div class="kc" ${big?'data-big="1"':''}>
    <div class="face"><div class="holo"></div><div class="grid"></div></div>
    <div class="sheen"></div>
    <div class="content">
      <div class="top"><span class="brand">USRKEY</span><span class="chip"></span></div>
      <div>
        <div class="nm">${name}</div>
        <div class="sub">${sub}</div>
        <div class="bars">${b}</div>
      </div>
    </div>
  </div>`;
}
function tiltCard(kc){
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const area=kc.closest('.herostage')||kc.parentElement;
  let raf;
  area.addEventListener('mousemove',e=>{
    const r=kc.getBoundingClientRect();
    const x=(e.clientX-(r.left+r.width/2))/r.width, y=(e.clientY-(r.top+r.height/2))/r.height;
    cancelAnimationFrame(raf);
    raf=requestAnimationFrame(()=>{
      kc.style.transform=`perspective(900px) rotateY(${x*16}deg) rotateX(${-y*16}deg)`;
      kc.style.setProperty('--a',(x*90+45)+'deg');
    });
  });
  area.addEventListener('mouseleave',()=>{kc.style.transform='perspective(900px)';kc.style.setProperty('--a','0deg');});
}

const QS=[
  {key:'identity',ai:'Getting to know you',h:'Who am I <span class="g">talking to</span>?',
   hint:"I&rsquo;m glad you&rsquo;re here. Tell me who you are — so I&rsquo;m useful from the first message, not the fifth.",
   ph:'Chad — founder building USRKey. US Central.',chips:['Founder','Engineer','Designer','Writer','Just curious'],note:'Only what you tell me. <b>Nothing inferred.</b>'},
  {key:'goals',ai:'What matters to you',h:'What are you <span class="g">working toward</span>?',
   hint:'Your goals right now — what you actually want to move forward. I&rsquo;ll keep them in view so my help points that way.',
   ph:'Launch USRKey and reach the first 1,000 people who need it.',chips:['Launching something','Growing an audience','Learning to build','Shipping faster'],note:'Kept in view. <b>Yours to change.</b>'},
  {key:'workstyle',ai:'How to show up',h:'How do you like to <span class="g">work</span>?',
   hint:'How should I show up — how much detail, how direct, plan first or just do it? I adapt to you, not the reverse.',
   ph:'Terse first, detail on request. Show me the diff. Plan before big changes.',chips:['Be concise','Be direct','Plan first','Show your work'],note:'I adapt to <b>you.</b>'},
  {key:'tasks',ai:'How I can help',h:'What can I <span class="g">take off your plate</span>?',
   hint:'The work you&rsquo;d rather not hold — so you can focus on your goals. Name it and I&rsquo;ll be ready to run.',
   ph:'Draft and clean up code, summarize what I missed, keep my next steps straight.',chips:['Draft & edit','Research & summarize','Track my tasks','Handle busywork'],note:'You decide what I <b>touch.</b>'}
];
const state={identity:'',goals:'',workstyle:'',tasks:''};
let step=0;
const stage=document.getElementById('stage');
const restartWrap=document.querySelector('.restart');

function firstName(){const s=(state.identity||'You').trim();const m=s.match(/[A-Z][a-z]+/);return m?m[0]:(s.split(/[\s,—-]/)[0]||'You');}
function esc(t){return (t||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function clause(t,f){if(!t)return f;const c=t.split(/[.\n—;]/)[0].trim();return c||f;}
function filled(){return ['identity','goals','workstyle','tasks'].filter(k=>state[k]).length;}

function render(){
  const prev=stage.querySelector('.screen.on');
  if(prev){prev.classList.remove('on');prev.classList.add('out');setTimeout(()=>prev.remove(),520);}
  const el=document.createElement('div');el.className='screen';el.innerHTML=view();
  stage.appendChild(el);
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('on')));
  restartWrap.style.display=step>0?'block':'none';
  wire(el);
}
function view(){
  if(step===0)return welcome();
  if(step>=1&&step<=4)return question(step-1);
  if(step===5)return reveal();
  if(step===6)return magic();
  return control();
}
function welcome(){return `<div class="welcome">
  <div class="copy">
    <span class="kicker">Where you <span class="b">start</span> with AI</span>
    <h1>Let AI know<br>what you&rsquo;re<br><span class="g">ready to build</span>.</h1>
    <p>New to AI, or tired of re-explaining yourself in every chat? Introduce yourself once — your goals, how you work — and every AI picks up from there. You own exactly what it sees.</p>
    <div class="row"><button class="btn" data-go="1">Introduce yourself →</button>
      <button class="lnk" data-go="6" style="opacity:.7">see how it works</button></div>
    <div class="meta"><span><b>~60s</b> to set up</span><span><b>no</b> account</span><span><b>a file</b> you own</span></div>
  </div>
  <div class="herostage"><div class="heroglow"></div>${cardHTML('Your name','USRKEY · YOURS',0,true)}</div>
</div>`;}
function question(i){const q=QS[i];
  const prog='<div class="prog">'+[0,1,2,3].map(k=>`<i class="${k<i?'done':k===i?'cur':''}"></i>`).join('')+'</div>';
  const nm=state.identity?esc(firstName()):'Your name';
  return `<div class="panel"><div class="qwrap">
    <div class="qmain">
      <div class="qtop"><span class="asker"><span class="orb"></span>${q.ai}</span>${prog}</div>
      <div class="qbody">
        <h2>${q.h}</h2>
        <p class="qhint">${q.hint}</p>
        <div class="entry"><textarea id="ans" rows="2" maxlength="240" placeholder="${q.ph}">${esc(state[q.key])}</textarea><span class="cnt" id="cnt"></span></div>
        <div class="chips">${q.chips.map(c=>`<span class="chip">${c}</span>`).join('')}</div>
      </div>
      <div class="qfoot"><button class="lnk" data-skip="1">Skip — I&rsquo;d rather not say</button>
        <button class="btn" data-next="1">${i<3?'Continue →':'Done — meet your AI →'}</button></div>
    </div>
    <div class="qside">${cardHTML(nm,'USRKEY · '+(i+1)+'/4',i+1,false)}
      <div class="sidenote">${q.note}</div></div>
  </div></div>`;}
function reveal(){
  const name=firstName();
  let role=clause(state.identity,'').replace(new RegExp('^'+name+'[\\s,—-]*','i'),'').trim()||'Context, self-issued';
  const r=(k,v,ph)=>`<div class="rr"><span class="k">${k}</span>${v?`<span class="v">${esc(v)}</span>`:`<span class="v skip">${ph}</span>`}</div>`;
  return `<div class="reveal">
    <span class="kicker">Your key · <span class="b">ready</span></span>
    ${cardHTML(esc(name),'USRKEY · '+filled()+'/4 FIELDS',filled(),true)}
    <div class="rows">
      ${r('Working toward',state.goals,'— skipped —')}
      ${r('Works best when',state.workstyle,'— skipped —')}
      ${r('Wants help with',state.tasks,'— skipped —')}
    </div>
    <p class="cap">This is what I understood — and you own all of it. Watch me put it to work.</p>
    <button class="btn" data-go="6">See it in action →</button>
  </div>`;}
function magic(){return `<div class="magic">
  <div class="top"><span class="kicker" style="color:var(--h3)">The moment</span>
    <h2 style="margin-top:8px">A fresh AI. <span class="g">No intro.</span></h2>
    <p>A model you&rsquo;ve never used — it sees only your key.</p></div>
  <div class="chatwin">
    <div class="cbar"><span class="l"><span class="chip" style="width:9px;height:9px;border-radius:50%;background:var(--h1)"></span>new chat</span>
      <span class="pill">USRKEY ATTACHED</span></div>
    <div class="msgs" id="msgs"></div>
  </div>
</div>`;}
function control(){
  const name=firstName();
  const md=`<span class="c"># identity</span>
${esc(state.identity||'(skipped)')}

<span class="h"># goals</span>
${esc(state.goals||'(skipped)')}

<span class="h"># working-style</span>
${esc(state.workstyle||'(skipped)')}

<span class="h"># how-i-help</span>
${esc(state.tasks||'(skipped)')}`;
  const t=(av,g,n,s)=>`<div class="tool"><div class="w"><div class="av" style="background:${g}">${av}</div><div><div class="n">${n}</div><div class="s">${s}</div></div></div><span class="tag">granted</span></div>`;
  return `<div class="panel"><div class="ctrl">
    <span class="kicker">You&rsquo;re in control</span>
    <h2>One key. <span class="g">You</span> decide who sees what.</h2>
    <p class="lede">Each AI gets only the fields you grant — your goals, your style, the tasks you hand it. Change or revoke any of it anytime; nothing leaves your device unless you say so.</p>
    <div class="grid2">
      <div>
        ${t('C','linear-gradient(135deg,#7cf3d0,#38bfa0)','Claude','identity · goals · style · tasks')}
        ${t('⌘','linear-gradient(135deg,#8ea2ff,#5b73e6)','Cursor','identity · goals · style')}
        ${t('G','linear-gradient(135deg,#e58bff,#b45be0)','ChatGPT · web','identity · goals')}
        ${t('+','linear-gradient(135deg,#ffd27c,#e0a640)','Any other','identity only')}
        <div class="sealed">◆ You granted each field yourself. Revoke or edit any of it in one tap — no AI widens its own access.</div>
      </div>
      <div class="filebox">
        <div class="fb"><span class="fn">◆ ${name.toLowerCase()}.usrkey.md</span><span class="m">the file underneath</span></div>
        <pre>${md}</pre>
      </div>
    </div>
    <div class="foot"><p>Underneath the glow it&rsquo;s a plain file you own and can read — carried to every AI, showing only what you chose.</p>
      <button class="btn ghost" data-go="0">↺ Make another</button></div>
  </div></div>`;}

function wire(el){
  el.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{step=+b.dataset.go;render();});
  el.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{save(el);step++;render();});
  el.querySelectorAll('[data-skip]').forEach(b=>b.onclick=()=>{state[QS[step-1].key]='';step++;render();});
  const ta=el.querySelector('#ans'),cnt=el.querySelector('#cnt');
  if(ta){const upd=()=>{cnt.textContent=ta.value.length?ta.value.length+'/240':'';};upd();
    setTimeout(()=>ta.focus(),560);ta.addEventListener('input',upd);
    el.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ta.value=(ta.value.trim()?ta.value.trim()+', ':'')+c.textContent;ta.focus();upd();});
    ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)){save(el);step++;render();}});
  }
  el.querySelectorAll('.kc').forEach(tiltCard);
  if(el.querySelector('#msgs'))runChat(el);
}
function save(el){const ta=el.querySelector('#ans');if(ta)state[QS[step-1].key]=ta.value.trim();}
document.getElementById('restart').onclick=()=>{step=0;render();};

function runChat(el){
  const box=el.querySelector('#msgs');const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const name=firstName(),goals=clause(state.goals,''),workstyle=clause(state.workstyle,''),tasks=clause(state.tasks,'');
  box.innerHTML=`<div class="msg you">hey</div>`;
  const parts=[`Hey <b>${esc(name)}</b> — good to meet you.`];
  if(goals)parts.push(`I know you&rsquo;re working toward <b>${esc(goals.toLowerCase())}</b>,`);
  if(workstyle)parts.push(`and I&rsquo;ll work the way you like — ${esc(workstyle.toLowerCase())}.`);
  parts.push(tasks?`Want me to start on ${esc(tasks.toLowerCase())}?`:`Where do you want to start?`);
  const ai=`<div class="msg ai">${parts.join(' ')}</div>`;
  setTimeout(()=>{const t=document.createElement('div');t.className='msg ai';t.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';box.appendChild(t);
    setTimeout(()=>{t.outerHTML=ai;
      setTimeout(()=>{const c=document.createElement('div');c.style.cssText='text-align:center;margin-top:14px';
        c.innerHTML='<button class="btn ghost" data-go="7">It just knew → see what it saw</button>';
        box.parentElement.appendChild(c);c.querySelector('button').onclick=()=>{step=7;render();};},640);
    },reduce?0:1250);
  },560);
}
render();
</script>
</body>
</html>
